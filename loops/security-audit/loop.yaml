name: security-audit
description: 対象コードベースのセキュリティ監査（OWASP・秘密情報・認証認可・依存関係）を行い、発見事項とIssue・任意レポートを残す

agent: opencode
max_iterations: 20
min_iterations: 3
completion_promise: SECURITY_AUDIT_COMPLETE
autonomy_level: L1
max_runs_per_day: 2

# ホスト側 Issue 完了ゲート (run-loop.sh)
require_issue: true
seed_files: plan.md,findings.md

prompt_file: prompt.md
report_template: report-template.md

# vendor/ecc から取り込む資材 (setup/sync-ecc-assets.sh --loop security-audit)
# security-review / production-audit が未同期の場合は上記 sync を実行すること
ecc_agents: security-reviewer,code-reviewer
ecc_skills: security-review,production-audit
ecc_rules: common
